name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rho-cli
            asset_name: rho-cli-linux-x64
            use_cross: false
            build_args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: rho-cli
            asset_name: rho-cli-linux-x64-static
            use_cross: true
            build_args: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: rho-cli
            asset_name: rho-cli-linux-arm64
            use_cross: true
            build_args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rho-cli
            asset_name: rho-cli-macos-x64
            use_cross: false
            build_args: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rho-cli
            asset_name: rho-cli-macos-arm64
            use_cross: false
            build_args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rho-cli.exe
            asset_name: rho-cli-windows-x64.exe
            use_cross: false
            build_args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rho
            asset_name: rho-linux-x64
            use_cross: false
            build_args: "-p rho-gui"
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rho
            asset_name: rho-macos-x64
            use_cross: false
            build_args: "-p rho-gui"
            macos_gui: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rho
            asset_name: rho-macos-arm64
            use_cross: false
            build_args: "-p rho-gui"
            macos_gui: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rho.exe
            asset_name: rho-windows-x64.exe
            use_cross: false
            build_args: "-p rho-gui"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install GUI dependencies
        if: contains(matrix.asset_name, 'rho-') && !contains(matrix.asset_name, 'cli') && contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build ${{ matrix.build_args }} --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: "!matrix.use_cross"
        run: cargo build ${{ matrix.build_args }} --release --target ${{ matrix.target }}

      - name: Install cargo-bundle
        if: matrix.macos_gui
        run: cargo install cargo-bundle

      - name: Create macOS app bundle
        if: matrix.macos_gui
        run: cargo bundle --release --target ${{ matrix.target }}
        working-directory: crates/rho-gui

      - name: Codesign and zip app bundle
        if: matrix.macos_gui
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/osx/Rho.app"
          codesign --force --deep -s - "$APP_PATH"
          ASSET_NAME="${{ matrix.asset_name }}-app"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/${ASSET_NAME}.zip" Rho.app

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload app bundle
        if: matrix.macos_gui
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-app
          path: ${{ matrix.asset_name }}-app.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        run: gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          for asset_dir in ./artifacts/*; do
            if [ -d "$asset_dir" ]; then
              asset_name=$(basename "$asset_dir")
              asset_file=$(find "$asset_dir" -type f | head -1)
              if [ -n "$asset_file" ]; then
                # Preserve file extension (e.g. .zip for app bundles)
                file_ext="${asset_file##*.}"
                upload_name="$asset_name"
                if [ "$file_ext" = "zip" ] && [[ "$asset_name" != *.zip ]]; then
                  upload_name="${asset_name}.zip"
                fi
                echo "Uploading $asset_file as $upload_name"
                cp "$asset_file" "./$upload_name"
                gh release upload ${{ github.ref_name }} "./$upload_name" --clobber
              fi
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

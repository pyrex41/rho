[package]
name = "rho-session"
version = "0.2.0"
edition = "2021"
description = "Session persistence for the rho AI coding agent"
license = "MIT"
repository = "https://github.com/pyrex41/rho"

[dependencies]
rho-core = { version = "0.2.0", path = "../rho-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

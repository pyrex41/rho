[package]
name = "rho-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server mode for the rho AI coding agent"
license = "MIT"
repository = "https://github.com/pyrex41/rho"

[dependencies]
rho-core = { version = "0.1.0", path = "../rho-core" }
rho-tools = { version = "0.1.0", path = "../rho-tools" }
rho-provider = { version = "0.1.0", path = "../rho-provider" }
rho-session = { version = "0.1.0", path = "../rho-session" }

axum = { version = "0.8", features = ["json"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-stream = "0.3"

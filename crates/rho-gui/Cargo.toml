[package]
name = "rho-gui"
version = "0.8.0"
edition = "2021"
publish = false

[[bin]]
name = "rho"
path = "src/main.rs"

[dependencies]
rho-core = { path = "../rho-core" }
rho-provider = { path = "../rho-provider" }
rho-tools = { path = "../rho-tools" }
iced = { version = "0.14", features = ["markdown", "highlighter", "tokio"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dirs = "5"

[package.metadata.bundle]
name = "Rho"
identifier = "com.pyrex41.rho"
icon = ["assets/icon.icns"]
category = "public.app-category.developer-tools"
short_description = "AI-powered development assistant"
copyright = "Copyright (c) 2026 Pyrex41"

[package.metadata.bundle.osx]
minimum_system_version = "12.0"

[dev-dependencies]
tempfile = "3.25.0"

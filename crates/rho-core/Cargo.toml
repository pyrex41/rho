[package]
name = "rho-core"
version = "0.1.0"
edition = "2021"
description = "Core types and agent loop for the rho AI coding agent"
license = "MIT"
repository = "https://github.com/pyrex41/rho"

[dependencies]
serde = { workspace = true }
tokio = { workspace = true }

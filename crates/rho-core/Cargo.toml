rusqlite = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Absorbed from anthropic-auth
reqwest = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
open = "5"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
    "crates/rho-core",
    "crates/rho-hashline",
    "crates/rho-provider",
    "crates/rho-tools",
    "crates/rho-server",
    "crates/rho-gui",
]
resolver = "2"

[package]
name = "rho-agent"
version = "0.7.2"
edition = "2021"
description = "AI coding agent with file tools"
license = "MIT"
repository = "https://github.com/pyrex41/rho"

[[bin]]
name = "rho-cli"
path = "src/main.rs"

[dependencies]
rho-core = { version = "0.7.0", path = "crates/rho-core" }
rho-provider = { version = "0.7.0", path = "crates/rho-provider" }
rho-tools = { version = "0.7.0", path = "crates/rho-tools" }
rho-server = { version = "0.7.0", path = "crates/rho-server" }
tokio = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
bytes = "1"
regex = "1"
similar = "2"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"